<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive vanilla JavaScript image slider demo">
  <title>Image Slider Library</title>
  <link rel="stylesheet" href="style.css">
  <script src="slider.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">VANILLA JAVASCRIPT COMPONENT</p>
      <h1>Image Slider Library</h1>
      <p>A responsive, looping slider built with HTML, CSS, and JavaScript.</p>
    </header>

    <section class="slider" aria-label="Featured images">
      <div class="slider__viewport">
        <div class="slider__track" id="sliderTrack">
          <figure class="slide">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=85"
                 alt="Sunlit mountain landscape">
            <figcaption class="slide__caption">Find your next horizon</figcaption>
          </figure>
          <figure class="slide">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=85"
                 alt="Mountain lake surrounded by forest">
            <figcaption class="slide__caption">Quiet places, clear thoughts</figcaption>
          </figure>
          <figure class="slide">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=85"
                 alt="Dramatic mountain peaks">
            <figcaption class="slide__caption">Keep exploring</figcaption>
          </figure>
          <figure class="slide">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=85"
                 alt="Sunlight entering a green forest">
            <figcaption class="slide__caption">Take the scenic route</figcaption>
          </figure>
        </div>
        <button class="slider__arrow slider__arrow--prev" id="prevButton"
                type="button" aria-label="Previous image">&#10094;</button>
        <button class="slider__arrow slider__arrow--next" id="nextButton"
                type="button" aria-label="Next image">&#10095;</button>
        <p class="slider__status" id="sliderStatus" aria-live="polite">Image 1 of 4</p>
      </div>
      <div class="slider__dots" id="sliderDots" aria-label="Choose an image"></div>
    </section>

    <footer class="footer">
      <span>Built with semantic HTML, responsive CSS, and vanilla JavaScript.</span>
      <span>Use arrows or dots to navigate.</span>
    </footer>
  </main>
</body>
</html>
